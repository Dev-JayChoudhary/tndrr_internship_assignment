<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inventory Management - VeggieTrack Vegetable Stock Management">
    <title>Inventory | VeggieTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/inventory.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                </svg>
            </div>
            <span class="sidebar-logo-text">🥬 VeggieTrack</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Dashboard
            </a>
            <a href="inventory.html" class="nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path
                        d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
                    </path>
                </svg>
                Inventory
            </a>
            <a href="insights.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                Insights
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <span class="user-name" id="userName">User</span>
                    <span class="user-role">Vendor</span>
                </div>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="logout()" id="logoutBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" width="18" height="18">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title">📦 Vegetable Inventory</h1>
                <p class="page-subtitle">Manage your fresh produce stock, shelf life, and sales</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openAddModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Vegetable
                </button>
            </div>
        </header>

        <!-- Search and Filters -->
        <section class="filter-bar">
            <div class="search-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" width="18" height="18" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" class="form-input search-input" placeholder="Search vegetables..."
                    oninput="loadProducts()">
            </div>
            <select id="categoryFilter" class="form-select filter-select" onchange="loadProducts()">
                <option value="">All Categories</option>
            </select>
        </section>

        <!-- Products Table -->
        <section class="card table-section">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Vegetable</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Stock (kg)</th>
                            <th>Safety</th>
                            <th>Price/kg</th>
                            <th>Shelf Life</th>
                            <th>Remaining</th>
                            <th>Sell</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Low Stock Alerts -->
        <section class="alert-section" id="lowStockSection" style="display:none;">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">⚠️ Low Stock Alert</h3>
                </div>
                <div class="low-stock-grid" id="lowStockGrid">
                </div>
            </div>
        </section>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Add Vegetable</h3>
                <button class="modal-close" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="productName">Vegetable Name</label>
                        <input type="text" id="productName" class="form-input" placeholder="e.g. Tomato" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="productSku">SKU</label>
                        <input type="text" id="productSku" class="form-input" placeholder="e.g. VEG-TOM-001" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="productCategory">Category</label>
                        <select id="productCategory" class="form-select" required>
                            <option value="Root Vegetables">Root Vegetables</option>
                            <option value="Leafy Greens">Leafy Greens</option>
                            <option value="Fruiting Vegetables">Fruiting Vegetables</option>
                            <option value="Cruciferous">Cruciferous</option>
                            <option value="Allium">Allium</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="productPrice">Price per kg ($)</label>
                        <input type="number" id="productPrice" class="form-input" step="0.01" min="0.01"
                            placeholder="2.49" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="productQuantity">Quantity (kg)</label>
                        <input type="number" id="productQuantity" class="form-input" min="0" placeholder="100" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="productSafetyStock">Safety Stock (kg)</label>
                        <input type="number" id="productSafetyStock" class="form-input" min="0" placeholder="20"
                            required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="productShelfLife">Shelf Life (days)</label>
                        <input type="number" id="productShelfLife" class="form-input" min="1" placeholder="7" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="productDateAdded">Date Added</label>
                        <input type="date" id="productDateAdded" class="form-input" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveButton">Save Vegetable</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reorder Modal -->
    <div class="modal-overlay" id="reorderModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">📦 Restock Vegetable</h3>
                <button class="modal-close" onclick="closeReorderModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" width="18" height="18">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="reorderProductInfo" class="reorder-info"></div>
            <div class="form-group" style="margin-top:1rem;">
                <label class="form-label" for="reorderQty">Restock Quantity (kg)</label>
                <input type="number" id="reorderQty" class="form-input" min="1" placeholder="50">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeReorderModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="confirmReorder()">Restock</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/inventory.js"></script>
</body>

</html>
