<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="VeggieTrack - Smart Vegetable Stock Management System. Login or sign up to manage your fresh produce inventory.">
    <title>Login | VeggieTrack</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="login-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Main Container -->
    <main class="login-container">
        <div class="login-card glass-card animate-fadeIn">
            <!-- Logo Section -->
            <div class="login-header">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <h1 class="logo-text">🥬 VeggieTrack</h1>
                <p class="login-subtitle">Smart Vegetable Stock Management</p>
            </div>

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Sign In</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Panel -->
            <div class="auth-panel active" id="loginPanel">
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label class="form-label" for="loginUsername">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon-text">👤</span>
                            <input type="text" id="loginUsername" class="form-input has-icon"
                                placeholder="Enter username or 'admin'" autocomplete="username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-text">🔒</span>
                            <input type="password" id="loginPassword" class="form-input has-icon"
                                placeholder="Enter your password" autocomplete="current-password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkbox-label">Remember me</span>
                        </label>
                    </div>

                    <div class="error-message hidden" id="loginError">Invalid credentials</div>

                    <button type="submit" class="btn btn-primary btn-login" id="loginButton">
                        Sign In
                    </button>

                    <div class="login-hint">
                        <p>👨‍💼 Admin: <code>admin</code> / <code>admin123</code></p>
                    </div>
                </form>
            </div>

            <!-- Signup Panel -->
            <div class="auth-panel" id="signupPanel">
                <form id="signupForm" class="login-form">
                    <div class="form-group">
                        <label class="form-label" for="signupUsername">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon-text">👤</span>
                            <input type="text" id="signupUsername" class="form-input has-icon"
                                placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-text">🔒</span>
                            <input type="password" id="signupPassword" class="form-input has-icon"
                                placeholder="Create a password (min 4 chars)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon-text">🔒</span>
                            <input type="password" id="signupConfirmPassword" class="form-input has-icon"
                                placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <div class="error-message hidden" id="signupError">Error</div>

                    <button type="submit" class="btn btn-primary btn-login" id="signupButton">
                        Create Account
                    </button>
                </form>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p><a href="home.html">← Back to Home</a></p>
            </div>
        </div>
    </main>

    <!-- Scripts
    <script src="assets/js/data.js"></script>
    <script src="assets/js/auth.js"></script> -->
</body>

</html>
